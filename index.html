<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duran Yachts | Something New Is on the Horizon</title>
<meta name="description" content="Duran Yachts — Miami yacht brokerage and maritime advisory. Something new is on the horizon.">
<style>
:root{
  --white:#ffffff;
  --black:#0a0a0a;
  --gold:#b99253;
  --soft:#f4f4f2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--white);color:var(--black)}
body{
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}
.page{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  background:
    radial-gradient(circle at 50% 35%, rgba(185,146,83,.045), transparent 34%),
    var(--white);
}
.content{
  position:relative;
  z-index:3;
  text-align:center;
  transform:translateY(-3vh);
}
.logo{
  width:min(430px,72vw);
  margin:0 auto 34px;
  filter:invert(1);
}
.tagline{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:400;
  font-size:clamp(34px,4.5vw,66px);
  line-height:1.05;
  letter-spacing:-.035em;
}
.subline{
  margin:20px 0 0;
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#646464;
}
.launching{
  margin:16px 0 0;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
}
.instagram{
  display:inline-flex;
  align-items:center;
  gap:9px;
  margin-top:30px;
  font-size:12px;
  letter-spacing:.08em;
  color:#1b1b1b;
  text-decoration:none;
  border-bottom:1px solid rgba(0,0,0,.28);
  padding-bottom:4px;
  transition:opacity .2s ease,border-color .2s ease;
}
.instagram:hover{
  opacity:.65;
  border-color:var(--gold);
}
.instagram svg{
  width:16px;
  height:16px;
  flex:none;
}

.ocean{
  position:absolute;
  left:0;right:0;bottom:-1px;
  height:31vh;
  min-height:190px;
  overflow:hidden;
  z-index:1;
}
.ocean::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(245,248,248,.9));
  pointer-events:none;
}
.wave{
  position:absolute;
  left:-15%;
  width:130%;
  height:180px;
  opacity:.38;
}
.wave.one{bottom:68px;animation:drift 18s linear infinite}
.wave.two{bottom:28px;opacity:.22;animation:drift-reverse 24s linear infinite}
.wave.three{bottom:-8px;opacity:.13;animation:drift 32s linear infinite}

@keyframes drift{
  from{transform:translateX(0)}
  to{transform:translateX(-8%)}
}
@keyframes drift-reverse{
  from{transform:translateX(-8%)}
  to{transform:translateX(0)}
}
.gold-line{
  position:absolute;
  left:50%;
  bottom:24px;
  width:54px;
  height:1px;
  background:var(--gold);
  transform:translateX(-50%);
  opacity:.85;
  z-index:4;
}
@media (prefers-reduced-motion: reduce){
  .wave{animation:none!important}
}
@media(max-width:600px){
  .page{padding:24px}
  .content{transform:translateY(-5vh)}
  .logo{width:min(330px,82vw);margin-bottom:28px}
  .subline{line-height:1.8;max-width:290px;margin-left:auto;margin-right:auto}
  .ocean{height:27vh;min-height:170px}
}
</style>
</head>
<body>
<main class="page">
  <section class="content">
    <img class="logo" src="duran-yachts-logo.png" alt="Duran Yachts">
    <h1 class="tagline">Something new is<br>on the horizon.</h1>
    <p class="subline">Miami · Yacht Brokerage · Maritime Advisory</p>
    <p class="launching">Launching soon</p>

    <a class="instagram" href="https://www.instagram.com/sailingwithsalva/" target="_blank" rel="noopener noreferrer" aria-label="Contact Duran Yachts on Instagram">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
      </svg>
      Contact on Instagram
    </a>
  </section>

  <div class="ocean" aria-hidden="true">
    <svg class="wave one" viewBox="0 0 1600 180" preserveAspectRatio="none">
      <path d="M0,108 C150,58 300,152 455,101 C610,50 755,145 910,96 C1060,49 1215,145 1370,91 C1465,58 1540,72 1600,97"
            fill="none" stroke="#9eb7bd" stroke-width="1.15"/>
    </svg>

    <svg class="wave two" viewBox="0 0 1600 180" preserveAspectRatio="none">
      <path d="M0,115 C130,155 275,55 425,104 C575,153 725,63 885,109 C1045,154 1200,64 1360,111 C1465,142 1540,124 1600,105"
            fill="none" stroke="#7fa0a7" stroke-width="1"/>
    </svg>

    <svg class="wave three" viewBox="0 0 1600 180" preserveAspectRatio="none">
      <path d="M0,103 C160,61 315,140 470,99 C625,59 780,140 935,98 C1095,54 1245,145 1400,101 C1495,74 1550,83 1600,94"
            fill="none" stroke="#b99253" stroke-width=".85"/>
    </svg>
  </div>

  <div class="gold-line" aria-hidden="true"></div>
</main>
</body>
</html>
